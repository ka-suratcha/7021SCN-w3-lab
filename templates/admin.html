<!DOCTYPE html>
<html><head><title>Admin Panel</title></head>
<body>
    <h1>Admin Panel - Welcome, {{ user['username'] }}</h1>
    <h2>Users</h2>
    <ul>
    {% for u in users %}
        <li>{{ u['username'] }}</li>
    {% endfor %}
    </ul><h2>All Products</h2><ul>
    {% for p in products %}
    <li>
        {{ p['name'] }}
        <a href="{{ url_for('delete_product', product_id=p['id']) }}">[Delete]</a>
    </li>
    {% endfor %}
    </ul><br><a href='/'>Back to Home</a></body></html>
